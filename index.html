<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global English UCC Practice Tool</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 650px; }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 10px; }
        .instruction { background: #e8f0fe; padding: 15px; border-radius: 8px; font-size: 0.9rem; color: #1967d2; line-height: 1.5; margin-bottom: 20px; }
        textarea { width: 100%; height: 180px; padding: 15px; border: 2px solid #dfe1e5; border-radius: 10px; font-size: 16px; box-sizing: border-box; transition: border 0.3s; }
        textarea:focus { border-color: #1a73e8; outline: none; }
        .info-bar { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.85rem; color: #5f6368; }
        .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 25px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button { padding: 12px 25px; border: none; border-radius: 25px; cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #startBtn { background-color: #d93025; color: white; }
        #stopBtn { background-color: #3c4043; color: white; display: none; }
        #downloadBtn { background-color: #188038; color: white; display: none; }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #dadce0; color: #70757a; cursor: not-allowed; }
        audio { width: 100%; margin-top: 15px; border-radius: 10px; display: none; }
        .status { font-weight: bold; color: #d93025; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Speaking Practice</h1>
    <div class="instruction">
        <strong>Guide:</strong> "Based on the revised script, record your voice for the part you will perform. If your role is minimal, record other characters' parts to ensure at least 2 minutes of audio."
    </div>
    
    <textarea id="scriptInput" placeholder="Enter your English script here..."></textarea>
    <div class="info-bar">
        <span id="wordCount">Words: 0</span>
        <span id="charCount">Characters: 0</span>
    </div>

    <div class="controls">
        <div id="recordingStatus" class="status">● RECORDING...</div>
        <div class="btn-group">
            <button id="startBtn">Record Now</button>
            <button id="stopBtn">Stop Recording</button>
            <button id="downloadBtn">Download MP3/WebM</button>
        </div>
        <audio id="audioPlayback" controls></audio>
    </div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let audioUrl = null;

    const scriptInput = document.getElementById('scriptInput');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const audioPlayback = document.getElementById('audioPlayback');
    const statusIdx = document.getElementById('recordingStatus');

    // 실시간 글자수/단어수 체크
    scriptInput.addEventListener('input', () => {
        const text = scriptInput.value.trim();
        charCount.innerText = `Characters: ${text.length}`;
        wordCount.innerText = `Words: ${text ? text.split(/\s+/).length : 0}`;
    });

    startBtn.onclick = async () => {
        audioChunks = [];
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // 지원되는 코덱 확인 (모바일 호환성 강화)
            const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
            mediaRecorder = new MediaRecorder(stream, { mimeType });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                
                // 기존 URL 해제 (메모리 누수 방지)
                if (audioUrl) URL.revokeObjectURL(audioUrl);
                
                audioUrl = URL.createObjectURL(audioBlob);
                audioPlayback.src = audioUrl;
                audioPlayback.style.display = 'block';
                downloadBtn.style.display = 'inline-block';
                
                // 스트림 종료 (마이크 아이콘 사라지게 함)
                stream.getTracks().forEach(track => track.stop());
            };

            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.style.display = 'inline-block';
            statusIdx.style.display = 'block';
            downloadBtn.style.display = 'none';
            audioPlayback.style.display = 'none';

        } catch (err) {
            alert("마이크 접근 권한이 필요합니다: " + err);
        }
    };

    stopBtn.onclick = () => {
        mediaRecorder.stop();
        startBtn.disabled = false;
        startBtn.innerText = "Record Again";
        stopBtn.style.display = 'none';
        statusIdx.style.display = 'none';
    };

    downloadBtn.onclick = () => {
        if (!audioUrl) return;
        const a = document.createElement('a');
        a.href = audioUrl;
        // 확장자는 브라우저가 지원하는 포맷에 따라 자동 설정
        const extension = mediaRecorder.mimeType.includes('webm') ? 'webm' : 'ogg';
        a.download = `UCC_Speaking_Assignment.${extension}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    };
</script>

</body>
</html>
